<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مادينيوم | تسجيل الدخول</title><link rel="icon" href="/madinum-logo.jpeg?v=2"><style>
@font-face{font-family:DIN;src:url('/fonts/din.ttf')}*{box-sizing:border-box}body{margin:0;background:#f1ecd9;color:#233d29;font-family:DIN,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:100%;max-width:420px;padding:36px;border:1px solid #c9ceba;border-radius:24px;background:#fbf8eb;box-shadow:0 24px 60px -35px #233d2955;animation:enter .6s ease-out}img{display:block;width:90px;margin:auto;border-radius:12px}h1{text-align:center;font-size:27px;margin:24px 0 8px}p{text-align:center;color:#647064;margin:0 0 26px}label{display:block;margin:18px 0 7px;font-size:15px}input{width:100%;padding:13px;border:1px solid #bfc8b1;background:white;border-radius:10px;font:inherit;color:#233d29;direction:ltr;text-align:left}input:focus{outline:2px solid #789879;outline-offset:2px}button{cursor:pointer;font:inherit}.submit{width:100%;margin-top:24px;border:0;border-radius:11px;background:#304e35;color:#fbf8eb;padding:13px;font-size:17px}.submit:disabled{opacity:.6;cursor:wait}.language{display:block;margin:0 0 15px auto;border:0;color:#426449;background:none}.error{color:#a34a30;text-align:start;margin:16px 0 0;font-size:14px;min-height:24px}@keyframes enter{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){main{animation:none}}
</style></head><body><main><button class="language" type="button">English</button><img src="/madinum-logo.jpeg?v=2" alt="Madinum"><h1>تسجيل الدخول</h1><p class="subtitle">لوحة هوازن المالية</p><form><label for="username">اسم المستخدم</label><input id="username" name="username" autocomplete="username" required maxlength="100"><label for="password">كلمة المرور</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200"><button class="submit" type="submit">دخول</button><div class="error" role="alert" aria-live="polite"></div></form></main><script>
let ar=true;const form=document.querySelector('form'),error=document.querySelector('.error'),button=document.querySelector('.submit');document.querySelector('.language').onclick=()=>{ar=!ar;document.documentElement.lang=ar?'ar':'en';document.documentElement.dir=ar?'rtl':'ltr';document.querySelector('h1').textContent=ar?'تسجيل الدخول':'Sign in';document.querySelector('.subtitle').textContent=ar?'لوحة هوازن المالية':'Hawazen financial dashboard';document.querySelector('[for=username]').textContent=ar?'اسم المستخدم':'Username';document.querySelector('[for=password]').textContent=ar?'كلمة المرور':'Password';button.textContent=ar?'دخول':'Sign in';document.querySelector('.language').textContent=ar?'English':'العربية';error.textContent='';};
form.onsubmit=async event=>{event.preventDefault();error.textContent='';button.disabled=true;try{const response=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:form.username.value,password:form.password.value})});if(response.ok){location.replace('/');return;}error.textContent=response.status===429?(ar?'محاولات كثيرة. حاول مجددًا بعد 15 دقيقة.':'Too many attempts. Try again in 15 minutes.'):(ar?'اسم المستخدم أو كلمة المرور غير صحيحة.':'Incorrect username or password.');form.password.value='';}catch{error.textContent=ar?'تعذر الاتصال. حاول مجددًا.':'Connection failed. Please try again.';}finally{button.disabled=false;}};
</script></body></html>
